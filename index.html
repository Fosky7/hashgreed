<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashgreed</title>

    <!--
      Anti-FOUC theme bootstrap.
      Runs SYNCHRONOUSLY before first paint and before React mounts so the
      correct theme class is on <html> immediately — no flash of the wrong theme.

      Contract (must match ThemeToggle.tsx):
        - localStorage key: "theme"
        - value "dark"  => add .dark to <html>
        - anything else  => LIGHT mode (default for first-time visitors)
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc.) — fall back to light.
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!--
      Import map: resolves the Waves SDK bare specifiers to esm.sh at runtime.
      These packages are intentionally NOT in node_modules; they load from the
      CDN via loadChainSdk() after Node globals (Buffer/process) are installed.
    -->
    <script type="importmap">
      {
        "imports": {
          "@waves/waves-transactions": "https://esm.sh/@waves/waves-transactions@4.3.4?target=es2020&bundle",
          "@waves/ts-lib-crypto": "https://esm.sh/@waves/ts-lib-crypto@1.4.4-beta.1?target=es2020&bundle"
        }
      }
    </script>
